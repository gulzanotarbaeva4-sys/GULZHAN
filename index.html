let questions=[],index=0,score=0,name="";
function begin(){name=document.getElementById('student').value.trim();if(!name){alert('Аты-жөніңізді енгізіңіз');return}questions=[...bank].sort(()=>Math.random()-.5).slice(0,25).map(q=>{const a=q[1].map((v,i)=>({v,ok:i===q[2]})).sort(()=>Math.random()-.5);return [q[0],a.map(x=>x.v),a.findIndex(x=>x.ok)]});document.getElementById('start').classList.add('hide');document.getElementById('game').classList.remove('hide');show()}
function show(){let q=questions[index];document.getElementById('stage').textContent=(index+1)+' / 25';document.getElementById('points').textContent='Ұпай: '+score;document.getElementById('progress').style.width=(index/25*100)+'%';document.getElementById('question').textContent=q[0];document.getElementById('feedback').textContent='';let a=document.getElementById('answers');a.innerHTML='';q[1].forEach((v,i)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>answer(i);a.appendChild(b)})}
function answer(n){let q=questions[index];let buttons=[...document.querySelectorAll('#answers button')];buttons.forEach(b=>b.disabled=true);if(n===q[2]){score+=4;document.getElementById('feedback').textContent='Дұрыс! +4 ұпай';}else{document.getElementById('feedback').textContent='Дұрыс жауап: '+q[1][q[2]];}document.getElementById('points').textContent='Ұпай: '+score;setTimeout(()=>{index++;if(index<25)show();else finish()},700)}
function finish(){document.getElementById('game').classList.add('hide');document.getElementById('finish').classList.remove('hide');document.getElementById('finalscore').textContent=score+' / 100';document.getElementById('comment').textContent=name+', нәтижеңіз: '+score+' ұпай.';try{const r=JSON.parse(localStorage.getItem('itquiz_results')||'[]');r.push({name:name,score:score,date:new Date().toLocaleString('kk-KZ')});localStorage.setItem('itquiz_results',JSON.stringify(r));}catch(e){}}
</script></body></html>
